<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0457b">
<title>تراهن عليّ؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a card table for two — score bar + round pips on top, one "playing card" question per step, chip bets, sticky main action */
:root{
  --bg:#f6eef2; --surface:#ffffff; --sunk:#faf4f7; --ink:#2a1530; --muted:#7a6680; --line:#ecdde5;
  --p0:#e0457b; --p0-soft:#fde2ec; --p1:#1f8a9b; --p1-soft:#d6eff2;
  --gold:#f0b23a; --gold-ink:#3d2a03; --good:#1f9a5c; --bad:#d0453a; --shadow:rgba(70,20,55,.10);
  --display:"Lalezar","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170d1a; --surface:#24162a; --sunk:#1d1222; --ink:#f7eef8; --muted:#ab97b0; --line:#3a2840;
  --p0:#ff7aa6; --p0-soft:#4b1e30; --p1:#5cc8d8; --p1-soft:#143a40;
  --gold:#f5c25a; --gold-ink:#2b1d02; --good:#4cc585; --bad:#ff6d5c; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170d1a; --surface:#24162a; --sunk:#1d1222; --ink:#f7eef8; --muted:#ab97b0; --line:#3a2840;
  --p0:#ff7aa6; --p0-soft:#4b1e30; --p1:#5cc8d8; --p1-soft:#143a40;
  --gold:#f5c25a; --gold-ink:#2b1d02; --good:#4cc585; --bad:#ff6d5c; --shadow:rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(60vmax 50vmax at 110% -10%,var(--p0-soft),transparent 60%),radial-gradient(60vmax 50vmax at -10% 110%,var(--p1-soft),transparent 60%);background-attachment:fixed}
*{box-sizing:border-box}
.app{max-width:540px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
#stage{display:flex;flex-direction:column;gap:14px}

/* ---------- score bar ---------- */
.bar{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 6px 20px var(--shadow);display:flex;flex-direction:column;gap:10px}
.players{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pl{display:flex;align-items:center;gap:10px;min-width:0}
.pl.r{flex-direction:row-reverse;text-align:end}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;color:#fff;position:relative;transition:box-shadow .25s}
.av.p0{background:var(--p0)} .av.p1{background:var(--p1)}
.pl.on .av.p0{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--p0)}
.pl.on .av.p1{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--p1)}
.pl .meta{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.pl .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.pl .sc{font-family:var(--display);font-size:1.7rem;line-height:1.05;font-variant-numeric:tabular-nums}
.pl.p0 .sc{color:var(--p0)} .pl.p1 .sc{color:var(--p1)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.pl.r .badges{justify-content:flex-end}
.bdg{font-size:.66rem;font-weight:800;padding:0 6px;border-radius:6px;white-space:nowrap;line-height:1.7}
.bdg.lie{background:var(--gold);color:var(--gold-ink)}
.bdg.burn{border:1px dashed var(--muted);color:var(--muted)}
.bdg.st{border:1px solid var(--good);color:var(--good)}
.bdg.you{background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.mid{text-align:center;line-height:1.1}
.mid b{display:block;font-family:var(--display);font-weight:400;font-size:1.25rem;font-variant-numeric:tabular-nums}
.mid span{font-size:.72rem;color:var(--muted);font-weight:700}
.pips{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;direction:rtl}
.pip{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:transparent}
.pip.n{border-radius:3px}
.pip.w{width:18px;border-radius:6px;background:linear-gradient(90deg,var(--p1-soft) 50%,var(--p0-soft) 50%)}
.pip.fin{border-color:var(--gold)}
.pip.done{background:var(--muted);border-color:var(--muted)}
.pip.done.w{background:linear-gradient(90deg,var(--p1) 50%,var(--p0) 50%);border-color:transparent}
.pip.cur{border-color:var(--ink);transform:scale(1.35)}
.net{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.net.off i{background:var(--bad)} .net.wait i{background:var(--gold)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 20px var(--shadow)}
.card.flat{box-shadow:none;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.eyebrow{font-size:.8rem;font-weight:800;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1.05;margin:0;text-align:center;text-wrap:balance}
h1 .a{color:var(--p0)} h1 .b{color:var(--p1)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,6.5vw,2.1rem);line-height:1.25;margin:0;text-wrap:balance}
h3{margin:0;font-size:1.05rem;font-weight:800}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.c0{color:var(--p0)} .c1{color:var(--p1)}
.lead{text-align:center;color:var(--muted);max-width:40ch;margin:0 auto}

/* question as a playing card */
.qcard{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:26px 22px 24px;box-shadow:0 10px 30px var(--shadow);display:flex;flex-direction:column;gap:14px;animation:deal .45s cubic-bezier(.2,.8,.2,1)}
.qcard::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--line);border-radius:18px;pointer-events:none}
.qcard .corner{position:absolute;font-family:var(--display);font-size:1.1rem;color:var(--line);line-height:1}
.qcard .corner.tl{top:14px;left:18px} .qcard .corner.br{bottom:14px;right:18px;transform:rotate(180deg)}
.qcard .who-line{font-size:.85rem;font-weight:800;color:var(--muted);position:relative}
.qtags{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.stamp{font-size:.76rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1.5px solid var(--line);color:var(--muted)}
.stamp.fin{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.stamp.w{background:linear-gradient(90deg,var(--p1-soft),var(--p0-soft));border-color:transparent;color:var(--ink)}
.qtext{font-size:clamp(1.3rem,5.4vw,1.6rem);font-weight:800;line-height:1.4;text-wrap:balance;position:relative}
@keyframes deal{from{transform:translateY(14px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:370px){.opts{grid-template-columns:1fr}}
.opt{font-family:var(--body);font-size:1rem;font-weight:700;text-align:start;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer;min-height:60px;line-height:1.35;transition:transform .1s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--ink) inset}
.opt.sel.lie{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.opt:disabled{opacity:.35;cursor:default}
.opt.truth{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.opt.wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset;opacity:.8}
.opt.static{cursor:default}
.opt .tick{float:left;font-weight:800;color:var(--good)}
.opt.big{font-family:var(--display);font-weight:400;font-size:1.6rem;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.opt.big .av{width:38px;height:38px;font-size:1.1rem}
.opt.big.p0.sel{border-color:var(--p0);box-shadow:0 0 0 2px var(--p0) inset;background:var(--p0-soft)}
.opt.big.p1.sel{border-color:var(--p1);box-shadow:0 0 0 2px var(--p1) inset;background:var(--p1-soft)}

.num{display:flex;flex-direction:column;gap:10px}
.num output{font-family:var(--display);font-size:3rem;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.num output small{font-family:var(--body);font-size:1rem;color:var(--muted);margin-inline-start:6px}
.num input[type=range]{width:100%;accent-color:var(--p0);direction:rtl;height:28px}
.num .ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

.seg{display:flex;flex-direction:column;gap:8px}
.seg label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:var(--sunk)}
.seg label.sel{border-color:var(--ink);background:var(--surface)}
.seg label.sel.lie{border-color:var(--gold)}
.seg label.off{opacity:.4;cursor:default}
.seg input{margin-top:5px;accent-color:var(--ink)}
.seg b{display:block}
.seg small{color:var(--muted);font-size:.85rem}
.sub{background:var(--sunk);border:2px dashed var(--gold);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* chips */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{width:50px;height:50px;border-radius:50%;font-family:var(--display);font-size:1.5rem;cursor:pointer;color:var(--ink);line-height:1;
  background:var(--surface);border:3px dashed var(--line);display:grid;place-items:center;transition:transform .12s}
.chip.sel{background:var(--gold);color:var(--gold-ink);border:3px dashed var(--gold-ink);transform:translateY(-5px);box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 45%,var(--ink))}
.betlabel{text-align:center;font-size:.92rem;color:var(--muted);font-weight:700;min-height:1.5em}

.hint{border-radius:16px;padding:12px 14px;background:var(--sunk);border:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hint.say{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.hint .q{font-weight:800;font-size:1.15rem}
.hint small{color:var(--muted)}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--sunk);border-radius:16px;padding:12px 14px;flex-wrap:wrap}
.summary .g{font-weight:800}
.betbadge{font-family:var(--display);background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:2px 14px;font-size:1.25rem;white-space:nowrap}

/* buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1 1 140px}
.btn{font-family:var(--body);font-size:1.08rem;font-weight:800;border-radius:16px;padding:15px 18px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--surface);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.rose{background:var(--p0);border-color:var(--p0);color:#fff}
.btn.sm{font-size:.92rem;padding:9px 14px;border-radius:12px}
.btn:disabled{opacity:.35;cursor:default}
.cta{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 10px 24px var(--shadow)}
.link{background:none;border:0;color:var(--muted);font-family:var(--body);font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:underline;padding:6px;align-self:center}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.link:focus-visible,.tab:focus-visible,.cat:focus-visible,.seg label:focus-within{outline:3px solid var(--gold);outline-offset:2px}

/* pass / wait */
.pass{text-align:center;align-items:center;padding-block:36px}
.pass .av{width:96px;height:96px;font-size:2.6rem;animation:pulse 2s infinite}
.pass .who{font-family:var(--display);font-size:clamp(2.6rem,13vw,3.4rem);line-height:1.1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 18%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.wait{text-align:center;align-items:center}
.dots{display:inline-flex;gap:6px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* reveal */
.verdict{align-self:center;font-family:var(--display);font-size:clamp(2.4rem,12vw,3.2rem);line-height:1;padding:6px 22px 2px;border:4px solid currentColor;border-radius:14px;transform:rotate(-5deg);animation:thump .45s cubic-bezier(.3,1.6,.5,1)}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)} .verdict.mid{color:var(--gold)}
@keyframes thump{from{transform:rotate(-5deg) scale(2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.truthbox{text-align:center;display:flex;flex-direction:column;gap:2px}
.truthbox .v{font-size:1.45rem;font-weight:800}
.ledger{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ledger li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.ledger .l{display:flex;gap:8px;align-items:center;min-width:0}
.ledger .av{width:28px;height:28px;font-size:.9rem}
.ledger .pts{font-family:var(--display);font-size:1.4rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.pts.plus{color:var(--good)} .pts.minus{color:var(--bad)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo>div{border-radius:16px;padding:14px;text-align:center;background:var(--sunk);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.duo .n{font-weight:800;font-size:.9rem}
.duo .s{font-family:var(--display);font-size:2.2rem;line-height:1.1}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.logo{position:relative;width:96px;height:64px}
.logo span{position:absolute;top:0;width:64px;height:64px;border-radius:50%;border:5px dashed rgba(255,255,255,.75);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:#fff}
.logo .a{right:0;background:var(--p0);transform:rotate(-8deg)}
.logo .b{left:0;background:var(--p1);transform:rotate(10deg);z-index:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:5px;border-radius:16px;border:1.5px solid var(--line)}
.tab{font-family:var(--body);font-weight:800;font-size:1rem;padding:11px;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab.sel{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px var(--shadow)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:370px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:.85rem;font-weight:800}
.field input{font-family:var(--body);font-size:1rem;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);min-width:0;width:100%}
.field input:focus{border-color:var(--ink);outline:none}
.field.f0 label{color:var(--p0)} .field.f1 label{color:var(--p1)}
.field.f0 input:focus{border-color:var(--p0)} .field.f1 input:focus{border-color:var(--p1)}
.codein{font-family:var(--display)!important;font-size:1.8rem!important;letter-spacing:.3em;text-align:center;direction:ltr;text-transform:uppercase}
.rounds{display:flex;gap:8px}
.rounds button{flex:1;font-family:var(--body);font-weight:800;font-size:1rem;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.rounds button.sel{border-color:var(--ink);background:var(--surface)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-family:var(--body);font-weight:700;font-size:.88rem;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--sunk);color:var(--muted);cursor:pointer}
.cat.sel{border-color:var(--p0);color:var(--p0);background:var(--surface)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:1.5px;background:var(--line)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface));flex-wrap:wrap}
.code{font-family:var(--display);font-size:3.4rem;letter-spacing:.2em;text-align:center;direction:ltr;line-height:1;padding:14px;border-radius:18px;background:var(--sunk);border:2px dashed var(--line)}
.note{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.rules{grid-template-columns:1fr}}
.rule{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-inline-start:4px solid var(--line)}
.rule .k{font-family:var(--display);font-size:1.2rem;line-height:1.3}
.rule p{font-size:.9rem;color:var(--muted);line-height:1.5}
.rule.r1{border-color:var(--ink)} .rule.r2{border-color:var(--p0)} .rule.r3{border-color:var(--gold)} .rule.r4{border-color:var(--p1)} .rule.r5{border-color:var(--good)}
details summary{cursor:pointer;font-weight:800;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:8px}
.win{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.prize{border:2px dashed var(--gold);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.prize b{font-size:1.15rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center;z-index:20;font-size:.95rem;box-shadow:0 8px 24px var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- additions: ranking, mission, pot, summary, sound ---------- */
.rank{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:12px;font-family:var(--body);font-size:1.02rem;font-weight:700;text-align:start;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.ritem .rn{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;color:var(--muted)}
.ritem.on{border-color:var(--ink);background:var(--surface)}
.ritem.on .rn{background:var(--ink);color:var(--surface);border:2px solid var(--ink)}
.ritem.lie.on{border-color:var(--gold)} .ritem.lie.on .rn{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.rrev{display:flex;flex-direction:column;gap:6px}
.rrev li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sunk);border:2px solid var(--line)}
.rrev li.ok{border-color:var(--good)} .rrev li .rn{font-family:var(--display);font-size:1.2rem;width:22px;text-align:center}
.rrev li .gx{margin-inline-start:auto;font-size:.82rem;font-weight:800;color:var(--muted)}
.rrev li.ok .gx{color:var(--good)}
.rrev{list-style:none;margin:0;padding:0}

}

/* ================= deck ================= */
// each block of 3: one choice, then a ranking or number question, then both answer together. Last 2 rounds: choice (double bets).
function roundType(i,total){
  if(i>=total-2) return 'c';
  const pos=i%3, tr=Math.floor(i/3);
  if(pos===2) return 'w';
  if(pos===1) return tr%2===0?'k':'n';
  return 'c';
}
const isPotAfter=(i,total)=>(i===4||i===10||i===16)&&i<total-2;
function markSeen(ids){const s=new Set(store.get('tam-seen',[]));ids.forEach(x=>s.add(x));store.set('tam-seen',[...s]);}
function buildDeck(total,cats){
  const seen=new Set(store.get('tam-seen',[]));
  const order=(prefix,idxs)=>{const ids=idxs.map(i=>prefix+i);const f=shuffle(ids.filter(x=>!seen.has(x))),o=shuffle(ids.filter(x=>seen.has(x)));
    if(f.length<12){ids.forEach(x=>seen.delete(x));} return f.concat(o);};
  let cIdx=C.map((_,i)=>i).filter(i=>cats.includes(C[i][0])); if(cIdx.length<total) cIdx=C.map((_,i)=>i);
  const pools={c:order('c',cIdx),n:order('n',N.map((_,i)=>i)),w:order('w',W.map((_,i)=>i)),k:order('k',K.map((_,i)=>i))};
  const deck=[]; for(let i=0;i<total;i++) deck.push(pools[roundType(i,total)].shift());
  store.set('tam-seen',[...seen]); markSeen(deck);
  return deck;
}

const STAT0=()=>({bigWins:0,lieWins:0,challengeWins:0,partnerLoss:0,whoAgree:0,exact:0,streak3:0,acceptWins:0,retreats:0,trueHelps:0,rankPerfect:0,potSteals:0,potShares:0,betray:0,guesses:0,correct:0,betSum:0});
function mProgress(g,i){
  const m=MISSIONS[g.missions[i]],s=g.stats[i];
  if(m.k==='loyal'){const ok=g.potCount>0&&s.potShares===g.potCount&&s.betray===0;return {v:ok?1:0,n:1,done:ok};}
  const v=s[m.k]||0;return {v:Math.min(v,m.n),n:m.n,done:v>=m.n};
}

/* ================= game logic ================= */
function newGame(names,total,cats,prize,starter){
  const ms=shuffle(MISSIONS.map((_,i)=>i));
  const g={status:'play',total,cats,prize:prize||'',deck:buildDeck(total,cats),round:0,starter:starter||0,
    players:names.map(n=>({name:n,score:0,lies:1,streak:0,custom:1})),stats:[STAT0(),STAT0()],missions:[ms[0],ms[1]],missionDone:[false,false],
    log:[],potCount:0,potTrust:0,potDone:[],phase:'mission',ready:{p0:null,p1:null},r:null,who:null,pot:null};
  return g;
}
function startRound(g){
  const id=g.deck[g.round]; g.who=null; g.pot=null;
  if(id[0]==='w'){g.phase='who';g.r={qid:id};g.who={p0:null,p1:null};return;}
  let k=0;for(let i=0;i<g.round;i++) if(g.deck[i][0]!=='w') k++;
  const A=(k+g.starter)%2;
  g.phase='secret';
  g.r={qid:id,answerer:A,guesser:1-A,truth:null,hint:'none',shown:null,guess:null,bet:null,challenged:null,accepted:null,result:null,custom:null};
}
function resolve(g){
  const r=g.r,q=qOf(r),A=r.answerer,Gi=r.guesser,P=g.players,S=g.stats,ch=chipsOf(g),lines=[];
  const base=r.accepted===false?ch[0]:r.bet, mult=r.accepted?2:1, stake=base*mult;
  let correct,exact,gp,why,m=null;
  if(q.t==='n'){exact=r.guess===r.truth;correct=exact||near(q,r.guess,r.truth);gp=exact?2*stake:correct?stake:-stake;why=correct?(exact?'الرقم بالزبط! ×2':`قريب (ضمن ±${q.tol})`):'بعيد';}
  else if(q.t==='k'){m=r.guess.filter((x,j)=>x===r.truth[j]).length;exact=m===4;correct=m>=2;gp=m===4?2*stake:m===2?stake:m===1?0:-stake;why=m===4?'الترتيب كامل! ×2':`${m} من 4 بمكانهم`;}
  else{correct=r.guess===r.truth;exact=correct;gp=correct?stake:-stake;why=correct?'تخمين صح':'تخمين غلط';}
  if(r.accepted) why+=' · قبل التحدّي ×2'; else if(r.accepted===false) why+=` · انسحب، الرهان صار ${ch[0]}`;
  lines.push({p:Gi,pts:gp,why}); P[Gi].score+=gp;
  const sg=S[Gi],sa=S[A];
  sg.guesses++; sg.betSum+=r.bet; if(correct) sg.correct++;
  if(correct&&r.bet>=5) sg.bigWins++;
  if(gp<0) sa.partnerLoss+=-gp;
  if(q.t==='n'&&exact) sg.exact++;
  if(q.t==='k'&&m===4) sg.rankPerfect++;
  if(r.challenged&&!correct) sa.challengeWins++;
  if(r.accepted&&correct) sg.acceptWins++;
  if(r.accepted===false) sa.retreats++;
  if(correct){P[Gi].streak=(P[Gi].streak||0)+1;if(P[Gi].streak>=3){P[Gi].score+=3;P[Gi].streak=0;sg.streak3++;lines.push({p:Gi,pts:3,why:'سلسلة: 3 صح ورا بعض'});}}
  else P[Gi].streak=0;
  let fooled=false;
  if(r.hint==='lie'){
    P[A].lies=Math.max(0,P[A].lies-1);
    fooled=!correct&&(q.t==='n'?near(q,r.guess,r.shown):q.t==='k'?r.guess[0]===r.shown:r.guess===r.shown);
    if(fooled){P[A].score+=stake;sa.lieWins++;lines.push({p:A,pts:stake,why:'انخدع بكرت الكذب'});}
    else lines.push({p:A,pts:0,why:'كرت الكذب ما زبط'});
  } else if(r.hint==='true'&&correct){P[A].score+=1;sa.trueHelps++;lines.push({p:A,pts:1,why:'مكافأة الصراحة'});}
  r.result={correct,exact,m,lines};
  g.log.push({t:q.t,cat:q.cat,q:q.q,g:Gi,a:A,ok:correct,pts:gp,lie:fooled,ch:!!r.challenged});
  g.phase='reveal';
}
function resolveWho(g){
  const a=g.who.p0,b=g.who.p1,agree=a.pick===b.pick,lines=[];
  [a,b].forEach((x,i)=>{const pts=agree?x.bet:-x.bet;g.players[i].score+=pts;if(agree)g.stats[i].whoAgree++;lines.push({p:i,pts,why:agree?'اتفقتوا':'اختلفتوا'});});
  g.r.result={agree,lines}; g.log.push({t:'w',q:qOf(g.r).q,agree}); g.phase='reveal';
}
const potSize=g=>4+3*g.potTrust;
function startPot(g){ g.phase='pot'; g.pot={p0:null,p1:null,size:potSize(g)}; }
function resolvePot(g){
  const P=g.pot.size, c=[g.pot.p0,g.pot.p1], lines=[]; let kind;
  if(c[0]==='share'&&c[1]==='share'){kind='trust';[0,1].forEach(i=>{g.players[i].score+=P;g.stats[i].potShares++;lines.push({p:i,pts:P,why:'ثقة متبادلة'});});g.potTrust++;}
  else if(c[0]==='take'&&c[1]==='take'){kind='greed';[0,1].forEach(i=>{g.players[i].score-=P;lines.push({p:i,pts:-P,why:'الاثنين طمعوا'});});g.potTrust=0;}
  else{kind='betray';const t=c[0]==='take'?0:1,win=Math.round(P*1.5);g.players[t].score+=win;g.stats[t].potSteals++;g.stats[t].betray++;
    lines.push({p:t,pts:win,why:'أخذ الصندوق لحاله'});lines.push({p:1-t,pts:0,why:'وثق وانخدع'});g.potTrust=0;}
  g.potCount++; g.pot.result={kind,lines}; g.log.push({t:'p',c,kind,P}); g.phase='potReveal';
}
function nextRound(g){
  if(g.phase==='reveal'&&isPotAfter(g.round,g.total)&&!g.potDone.includes(g.round)){startPot(g);return;}
  if(g.phase==='potReveal') g.potDone.push(g.round);
  g.round++;
  if(g.round>=g.total){
    [0,1].forEach(i=>{const d=mProgress(g,i).done;g.missionDone[i]=d;if(d) g.players[i].score+=10;});
    g.phase='end';g.status='end';
  } else startRound(g);
}

const AU={ctx:null,on:store.get('tam-sound',true),timer:null,next:0,bar:0};
function auInit(){
  if(AU.ctx) return true; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  try{
    const c=new AC(); AU.ctx=c;
    AU.master=c.createGain(); AU.master.gain.value=0; AU.master.connect(c.destination);
    const len=Math.floor(c.sampleRate*2.6),buf=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
    const conv=c.createConvolver(); conv.buffer=buf; const wet=c.createGain(); wet.gain.value=.5; conv.connect(wet); wet.connect(AU.master);
    AU.bus=c.createGain(); AU.bus.connect(AU.master); AU.bus.connect(conv);
    AU.fx=c.createGain(); AU.fx.gain.value=.55; AU.fx.connect(c.destination);
    return true;
  }catch(e){return false;}
}

function tone(m,t,dur,type,vol,dest,cut,att){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
  o.type=type;o.frequency.value=mtof(m);f.type='lowpass';f.frequency.value=cut||2200;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
const PROG=[[50,57,60,64,69],[43,53,59,62,64],[48,55,59,64,67],[45,55,60,64,67]]; // Dm9 · G13 · Cmaj9 · Am7
const BEAT=60/66;
function schedule(){
  const c=AU.ctx;
  while(AU.next<c.currentTime+1.5){
    const t=AU.next,ch=PROG[AU.bar%4];
    ch.slice(1,4).forEach(m=>{tone(m,t,BEAT*4+1.4,'triangle',.03,AU.bus,850,1.2);tone(m+12,t,BEAT*4+1,'sine',.01,AU.bus,1600,1.4);});
    tone(ch[0]-12,t,BEAT*2.2,'sine',.08,AU.bus,380,.05); tone(ch[0]-5,t+BEAT*2,BEAT*2,'sine',.05,AU.bus,380,.05);
    const sc=[ch[1]+12,ch[2]+12,ch[3]+12,ch[4]+12,ch[2]+24];
    for(let s=0;s<8;s++) if(Math.random()<.34) tone(sc[Math.floor(Math.random()*sc.length)],t+s*BEAT/2+(s%2?.04:0),1.6,'sine',.045,AU.bus,3000,.005);
    AU.next+=BEAT*4; AU.bar++;
  }
}
function musicOn(){
  if(!auInit()) return; const c=AU.ctx; if(c.state==='suspended') c.resume();
  if(!AU.timer){AU.next=c.currentTime+.15;schedule();AU.timer=setInterval(schedule,300);}
  AU.master.gain.cancelScheduledValues(c.currentTime); AU.master.gain.setTargetAtTime(.6,c.currentTime,1);
}
function musicOff(){ if(!AU.ctx) return; const c=AU.ctx; AU.master.gain.cancelScheduledValues(c.currentTime); AU.master.gain.setTargetAtTime(0,c.currentTime,.25); clearInterval(AU.timer); AU.timer=null; }
function sfx(k){
  if(!AU.on||!auInit()) return; const c=AU.ctx; if(c.state==='suspended') c.resume(); const t=c.currentTime+.01, d=AU.fx;
  const seq=(ns,gap,type,vol,dur)=>ns.forEach((m,i)=>tone(m,t+i*gap,dur||.5,type||'sine',vol||.12,d,4000,.005));
  if(k==='tick') seq([88],0,'sine',.06,.12);
  else if(k==='tap') seq([76],0,'triangle',.08,.15);
  else if(k==='good') seq([72,76,79,84],.08,'triangle',.11,.7);
  else if(k==='mid') seq([72,77],.12,'triangle',.1,.6);
  else if(k==='bad') seq([67,63,58],.14,'triangle',.11,.6);
  else if(k==='turn') seq([79,84],.12,'sine',.1,.5);
  else if(k==='win') seq([72,76,79,84,88,91],.1,'triangle',.12,1.1);
  else if(k==='coins') seq([96,91,96,100],.06,'square',.03,.18);
}

/* ---------- transport: Claude artifact db ---------- */
let wq=Promise.resolve();
const queue=fn=>{wq=wq.then(fn).catch(e=>toast(e&&e.code==='invalid_argument'?'ما في صلاحية تعدّل اللعبة. لازم تنشارك الصفحة معك كمحرّر.':'صار خلل بالاتصال. جرّب كمان مرة.'));};
function dbStart(code,initial){
  let existed=false,last='',unsub=null; const ref=db.doc('games/'+code);
  NET.send=g=>queue(()=>ref.set(g));
  NET.patch=(k,i,v)=>queue(()=>ref.update({[k]:{['p'+i]:v}}));
  NET.close=()=>{if(unsub)unsub();}; NET.reconnect=null;
  if(initial) NET.send(clone(initial));
  unsub=ref.onSnapshot(s=>{
    if(!s.exists){if(existed){toast('اللعبة انلغت.');goHome();}return;}
    existed=true; const d=s.data(),j=JSON.stringify(d); if(j===last) return; last=j; receive(clone(d));
  },()=>setConn('off'));
  setConn('on');
}
async function dbJoin(code,name){
  const s=await db.doc('games/'+code).get();
  if(!s.exists){toast('ما لقينا لعبة بهالكود.');return;}
  const g=clone(s.data());
  if(g.players[1]){toast('اللعبة فيها لاعبين. إذا إنت منهم، اضغط «كمل».');return;}
  g.players[1]={name,score:0,lies:1,streak:0,custom:1}; g.status='play';
  MODE='online';ME=1;VIEW='game';receive(g);dbStart(code,g);
}

/* ---------- transport: PeerJS (GitHub Pages / any static host) ---------- */
const PID=c=>'tarahen-aleyya-'+c;
const NETERR=['network','server-error','socket-error','socket-closed'];
function peerHost(code,tries){
  tries=tries||0; let conn=null; const peer=new Peer(PID(code));
  NET.send=g=>{if(conn&&conn.open) conn.send({t:'state',g});};
  NET.patch=(k,i,v)=>{if(conn&&conn.open) conn.send({t:'patch',k,i,v});};
  NET.close=()=>{try{peer.destroy();}catch(e){}}; NET.reconnect=null;
  setConn('wait');
  peer.on('open',()=>setConn(conn&&conn.open?'on':'wait'));
  peer.on('connection',c=>{
    if(conn&&conn.open&&conn!==c){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),600);});return;}
    conn=c;
    c.on('open',()=>setConn('on'));
    c.on('data',m=>{
      if(!m||typeof m!=='object') return;
      if(m.t==='hello'){
        if(!G.players[1]) act(g=>{g.players[1]={name:String(m.name||'').slice(0,14)||'اللاعب الثاني',score:0,lies:1,streak:0,custom:1};g.status='play';});
        else c.send({t:'state',g:G});
      } else onMsg(m);
    });
    c.on('close',()=>setConn('wait'));
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      try{peer.destroy();}catch(x){}
      if(G&&G.status==='lobby'&&tries<3){G.code=makeCode();persist();render();peerHost(G.code,tries+1);}
      else if(tries<8) setTimeout(()=>peerHost(code,tries+1),3000);
      else {setConn('off');toast('ما قدرنا نرجع نفتح اللعبة. افتحوا لعبة جديدة.');}
    } else if(NETERR.includes(e.type)){setConn('off');toast('ما في اتصال بسيرفر الربط. تأكد من الإنترنت.');}
  });
}
function peerGuest(code,name){
  let conn=null; const peer=new Peer();
  NET.send=g=>{if(conn&&conn.open) conn.send({t:'state',g});};
  NET.patch=(k,i,v)=>{if(conn&&conn.open) conn.send({t:'patch',k,i,v});};
  NET.close=()=>{try{peer.destroy();}catch(e){}};
  const connect=()=>{
    setConn('wait'); conn=peer.connect(PID(code),{reliable:true});
    conn.on('open',()=>{setConn('on');conn.send({t:'hello',name});});
    conn.on('data',m=>{ if(m&&m.t==='full'){toast('اللعبة فيها لاعبين.');goHome();} else onMsg(m); });
    conn.on('close',()=>setConn('off'));
  };
  NET.reconnect=()=>{ if(peer.disconnected){try{peer.reconnect();}catch(e){}} connect(); };
  peer.on('open',connect);
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){ setConn('off'); if(!G){toast('ما لقينا اللعبة. تأكد من الكود وإنه شريكك فاتح الصفحة.');goHome();} else toast('شريكك مش متصل هلّق. استنى وجرّب «أعد الاتصال».'); }
    else if(NETERR.includes(e.type)){setConn('off');toast('ما في اتصال بسيرفر الربط. تأكد من الإنترنت.');}
  });
}
function onMsg(m){
  if(!m||typeof m!=='object') return;
  if(m.t==='state'&&m.g&&m.g.players) receive(m.g);
  else if(m.t==='patch'&&G&&['ready','who','pot'].includes(m.k)&&G[m.k]&&(m.i===0||m.i===1)){G[m.k]['p'+m.i]=m.v;persist();render();}
}
function makeCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function goHome(){ try{NET.close();}catch(e){} NET.send=()=>{};NET.patch=()=>{};NET.reconnect=null; VIEW='home';MODE='local';G=null;ME=null;CONN=null; render(); top0(); }

    const txt=CONN==='on'?'متصلين':CONN==='wait'?(ME===0&&ONLINE==='peer'?'بنستنى شريكك يتصل':'عم نتصل…'):'الاتصال مقطوع';

  t.innerHTML=`<div class="bar"><div class="players">${pl(0)}<div class="mid"><span>الجولة</span><b>${label}</b>${isFinal(G)&&ph!=='end'?'<span style="color:var(--gold)">حسم</span>':''}<div>${sndBtn(1)}</div></div>${pl(1)}</div><div class="pips" aria-hidden="true">${pips}</div>${net}</div>`;

/* ---------- end-of-game summary ---------- */
function summary(){
  const L=G.log,gl=L.filter(x=>x.t!=='w'&&x.t!=='p'),S=G.stats;
  const pct=i=>S[i].guesses?Math.round(100*S[i].correct/S[i].guesses):0;
  const cats={};gl.forEach(x=>{const c=cats[x.cat]||(cats[x.cat]=[[0,0],[0,0]]);c[x.g][1]++;if(x.ok)c[x.g][0]++;});
  const catRows=Object.entries(cats).map(([k,v])=>`<div class="crow"><span class="cl">${esc(catName(k))}</span><div class="bars">${[0,1].map(i=>{const [a,b]=v[i];const w=b?Math.round(100*a/b):0;return `<div class="br"><span class="track"><span class="fill p${i}" style="width:${b?Math.max(w,4):0}%;display:block"></span></span><span class="v">${b?`${a}/${b}`:'—'}</span></div>`;}).join('')}</div></div>`).join('');
  const best=gl.slice().sort((a,b)=>b.pts-a.pts)[0], worst=gl.slice().sort((a,b)=>a.pts-b.pts)[0];
  const whoL=L.filter(x=>x.t==='w'),agree=whoL.filter(x=>x.agree).length;
  const pots=L.filter(x=>x.t==='p');
  const lies=[0,1].map(i=>S[i].lieWins);
  const mom=[];
  if(best&&best.pts>0) mom.push(`<li><span class="mk">أكبر ربح</span><span>${nm(best.g)} <b class="pts plus">${signed(best.pts)}</b> ع «${esc(best.q)}»</span></li>`);
  if(worst&&worst.pts<0) mom.push(`<li><span class="mk">أكبر خسارة</span><span>${nm(worst.g)} <b class="pts minus">${signed(worst.pts)}</b> ع «${esc(worst.q)}»</span></li>`);
  if(whoL.length) mom.push(`<li><span class="mk">مين فينا؟</span><span>اتفقتوا ${agree} من ${whoL.length} ${agree===whoL.length?'· نفس التفكير!':agree===0?'· ولا مرة!':''}</span></li>`);
  if(lies[0]||lies[1]) mom.push(`<li><span class="mk">كذبات نجحت</span><span>${[0,1].filter(i=>lies[i]).map(i=>`${nm(i)} خدع شريكه`).join(' · ')}</span></li>`);
  if(pots.length) mom.push(`<li><span class="mk">قصة الصندوق</span><span class="potstory">${pots.map(p=>p.kind==='trust'?'<span class="good">ثقة</span>':p.kind==='greed'?'<span class="bad">الاثنين طمعوا</span>':`<span class="bad">${esc(P(p.c[0]==='take'?0:1).name)} أخذه</span>`).join('')}</span></li>`);
  const titles=[0,1].map(i=>{const t=[];const o=1-i;
    if(pct(i)>pct(o)) t.push('قارئ الأفكار');
    if(S[i].lieWins) t.push('الكذّاب المحترف');
    if(S[i].betray) t.push('الطمّاع');
    if(G.potCount&&S[i].potShares===G.potCount) t.push('أهل الثقة');
    if(S[i].guesses&&S[o].guesses&&S[i].betSum/S[i].guesses>S[o].betSum/S[o].guesses) t.push('الجريء');
    if(S[i].challengeWins>=2) t.push('المخوّف');
    if(!t.length) t.push(pct(i)>=50?'بيعرف كثير':'لسا بيتعرّف');
    return t.slice(0,3);});
  return `<section class="card"><h3>مين بيعرف التاني أكثر؟</h3>
    <div class="acc">${[0,1].map(i=>`<div><span class="n c${i}" style="font-weight:800">${esc(P(i).name)}</span><span class="pc c${i}">${pct(i)}%</span><span class="sub2">خمّن صح ${S[i].correct} من ${S[i].guesses}</span><div class="titles c${i}">${titles[i].map(x=>`<span class="ttl">${x}</span>`).join('')}</div></div>`).join('')}</div></section>
  ${catRows?`<section class="card"><h3>حسب الموضوع</h3><div class="cats2">${catRows}</div><p class="muted small">الخط الأول ${nm(0)}، التاني ${nm(1)}.</p></section>`:''}
  <section class="card"><h3>المهمات السرية</h3><div class="mres">${[0,1].map(i=>`<div class="${G.missionDone[i]?'ok':''}"><span class="mtxt">${nm(i)}: ${esc(MISSIONS[G.missions[i]].t)}</span><b class="pts ${G.missionDone[i]?'plus':''}">${G.missionDone[i]?'+10':'ما زبطت'}</b></div>`).join('')}</div></section>
  ${mom.length?`<section class="card"><h3>لحظات اللعبة</h3><ul class="moments">${mom.join('')}</ul></section>`:''}`;
}
function vEnd(){
  const [a,b]=G.players,w=a.score===b.score?-1:(a.score>b.score?0:1);
  return `<section class="card pop"><div class="win"><span class="eyebrow">انتهت اللعبة</span>
    ${w<0?`<h1>تعادل!</h1><p class="lead">بتعرفوا بعض بنفس المقدار. أو بتكذبوا بنفس المهارة.</p>`:
      `${av(w,'width:84px;height:84px;font-size:2.4rem')}<h1 class="c${w}">${esc(P(w).name)}</h1><p class="lead">ربح!</p>`}</div>
    <div class="duo">${[0,1].map(i=>`<div><span class="n c${i}">${esc(P(i).name)}</span><span class="s c${i}">${P(i).score}</span></div>`).join('')}</div>
    ${G.prize?`<div class="prize"><span class="muted small">الرهان الكبير</span><b>${esc(G.prize)}</b>${w>=0?`<span>${nm(1-w)}، حان وقت الدفع.</span>`:'<span>تعادل… الاثنين بيدفعوا؟</span>'}</div>`:''}</section>
  ${summary()}
  <div class="btns"><button class="btn rose" type="button" data-act="rematch">لعبة جديدة</button><button class="btn ghost" type="button" data-act="home">الرئيسية</button></div>`;
}
function vGame(){
  if(!G) return waitCard('عم نتصل باللعبة')+`<button class="link" type="button" data-act="home">رجوع</button>`;
  if(G.status==='lobby'||!G.players[1]) return vLobby();
  if(G.phase==='end') return vEnd();
  syncDraft();
  if(MODE==='local'){
    let h=null,msg='';
    const ph=G.phase;
    if(ph==='secret'){h=G.r.answerer;msg=`السؤال عنك. خلّي ${esc(P(G.r.guesser).name)} يطّلع بعيد.`;}
    else if(ph==='guess'){h=G.r.guesser;msg=`دورك تخمّن ${esc(P(G.r.answerer).name)}.`;}
    else if(SIM[ph]){const p=pendingOf(ph);if(p.length){h=p[0];msg=ph==='mission'?'رح تشوف مهمتك السرية. ما تخلّي حدا يشوف.':ph==='pot'?'الصندوق المشترك. قرارك سرّي.':'الاثنين بيجاوبوا هالجولة. جاوب بالسر.';}}
    if(h!==null&&localSeen!==G.round+ph+h) return passCard(h,msg);
  }
  const v={mission:vMission,secret:vSecret,guess:vGuess,challenge:vChallenge,respond:vChallenge,who:vWho,reveal:vReveal,pot:vPot,potReveal:vPotReveal}[G.phase];
  return v()+`<button class="link" type="button" data-act="home">رجوع للرئيسية</button>`;
}
function playFx(){
  if(VIEW!=='game'||!G) return;
  const k=G.round+'|'+G.phase+'|'+(G.status||''); if(k===lastFxKey) return; const first=!lastFxKey; lastFxKey=k; if(first) return;
  const ph=G.phase;
  if(ph==='reveal'&&G.r.result){const r=G.r.result;sfx(r.agree===true||r.exact?'good':r.agree===false?'bad':r.correct?'mid':'bad');}
  else if(ph==='potReveal') sfx(G.pot.result.kind==='trust'?'coins':'bad');
  else if(ph==='end') sfx('win');
  else if(MODE==='online'){
    const r=G.r||{};const my=SIM[ph]?!(G[SIM[ph]]&&G[SIM[ph]]['p'+ME]):((ph==='secret'||ph==='challenge')&&r.answerer===ME)||((ph==='guess'||ph==='respond')&&r.guesser===ME);
    if(my) sfx('turn');
  }
}
function render(){ topBar(); $('stage').innerHTML=VIEW==='game'?vGame():vHome(); bindInputs(); playFx(); }

function bindInputs(){
  [['truth','truth'],['lie','lie'],['guess','guess']].forEach(([id,key])=>{
    const el=$(id); if(!el) return;
    el.addEventListener('input',()=>{
      D[key]=parseFloat(el.value);
      const q=qOf(G.r); $(id+'o').innerHTML=`${D[key]}<small>${esc(q.u)}</small>`;
      const b=document.querySelector('[data-act="submitSecret"]');
      if(b) b.disabled=!(D.hint!=='lie'||!near(q,D.lie,D.truth));
    });
  });
  const bt=(id,fn)=>{const el=$(id);if(el) el.addEventListener('input',()=>fn(el.value,el));};
  bt('n0',v=>{cfg.names[0]=v;saveCfg();}); bt('n1',v=>{cfg.names[1]=v;saveCfg();});
  bt('me',v=>{cfg.myName=v;saveCfg();}); bt('prize',v=>{cfg.prize=v;saveCfg();});
  bt('code',(v,el)=>{const c=v.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(c!==v)el.value=c;cfg.code=c;});
  bt('cq',v=>D.cq=v); [0,1,2,3].forEach(i=>bt('co'+i,v=>D.co[i]=v));
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  const a=t.dataset.act, v=t.dataset.v!==undefined?Number(t.dataset.v):null;
  if(['truth','guess','lie','pick','bet','wbet','rtruth','rguess','potc','cat','rounds'].includes(a)) sfx('tick'); else if(a!=='sound') sfx('tap');
  switch(a){
    case 'sound': AU.on=!AU.on; store.set('tam-sound',AU.on); if(AU.on) musicOn(); else musicOff(); render(); break;
    case 'tab': cfg.tab=t.dataset.k; saveCfg(); render(); break;
    case 'rounds': cfg.total=v; saveCfg(); render(); break;
    case 'cat': { const k=t.dataset.k; cfg.cats=cfg.cats.includes(k)?cfg.cats.filter(x=>x!==k):cfg.cats.concat(k); if(!cfg.cats.length) cfg.cats=[k]; saveCfg(); render(); break; }
    case 'startLocal': {
      const names=[cfg.names[0].trim()||'اللاعب الأول',cfg.names[1].trim()||'اللاعب الثاني'];
      MODE='local';ME=null;localSeen='';lastFxKey='';G=newGame(names,cfg.total,cfg.cats,cfg.prize.trim());VIEW='game';render();top0();break; }
    case 'create': {
      const name=cfg.myName.trim(); if(!name){toast('اكتب اسمك أول.');return;}
      const g=newGame([name,''],cfg.total,cfg.cats,cfg.prize.trim(),0);
      g.status='lobby'; g.code=makeCode(); g.createdAt=Date.now(); g.players=[g.players[0]];
      MODE='online';ME=0;G=g;VIEW='game';lastFxKey='';persist();render();top0();
      if(ONLINE==='db') dbStart(g.code,g); else peerHost(g.code);
      break; }
    case 'join': {
      const name=cfg.myName.trim(),code=(cfg.code||'').trim();
      if(!name){toast('اكتب اسمك أول.');return;} if(code.length!==4){toast('الكود 4 حروف.');return;}
      lastFxKey='';
      if(ONLINE==='db') queue(()=>dbJoin(code,name));
      else { MODE='online';ME=1;G=null;VIEW='game';render();peerGuest(code,name); }
      break; }
    case 'resumeOnline': {
      const sv=store.get('tam-online',null); if(!sv) return;
      MODE='online';ME=sv.me;G=sv.g;VIEW='game';lastFxKey='';render();
      if(ONLINE==='db') dbStart(sv.code,null);
      else if(sv.me===0) peerHost(sv.code);
      else peerGuest(sv.code,(sv.g.players[1]&&sv.g.players[1].name)||cfg.myName);
      break; }
    case 'forget': store.del('tam-online'); render(); break;
    case 'reconnect': if(NET.reconnect) NET.reconnect(); break;
    case 'copy': { const c=G.code; try{navigator.clipboard.writeText(c).then(()=>toast('انسخ الكود.'),()=>toast('الكود: '+c));}catch(x){toast('الكود: '+c);} break; }
    case 'cancel': { const code=G.code; if(ONLINE==='db') queue(()=>db.doc('games/'+code).delete()); store.del('tam-online'); goHome(); break; }
    case 'home': goHome(); break;
    case 'gate': localSeen=G.round+G.phase+v; render(); top0(); break;

    case 'readyMission': submitSim('mission',v,true); top0(); break;
    case 'simFinish': { const ph=t.dataset.k,k=SIM[ph]; act(g=>{if(g.phase===ph&&g[k].p0&&g[k].p1) FIN[ph](g);}); top0(); break; }
    case 'truth': D.truth=v; if(D.lie===v) D.lie=null; render(); break;
    case 'rtruth': toggleRank(D.truth,v); if(D.truth.length&&D.lie===D.truth[0]) D.lie=null; render(); break;
    case 'rguess': toggleRank(D.guess,v); render(); break;
    case 'lie': D.lie=v; render(); break;
    case 'editCustom': D.edit=true; if(D.custom){D.cq=D.custom.q;D.co=D.custom.o.concat(['','','','']).slice(0,4);} render(); break;
    case 'cancelCustom': D.edit=false; render(); break;
    case 'useCustom': {
      const q=D.cq.trim(),o=D.co.map(s=>s.trim()).filter(Boolean);
      if(!q){toast('اكتب السؤال.');return;} if(o.length<2){toast('لازم خيارين ع الأقل.');return;}
      D.custom={q,o}; D.edit=false; D.truth=null; D.lie=null; render(); break; }
    case 'submitSecret': act(g=>{const r=g.r;
      if(D.custom){r.custom=D.custom;g.players[r.answerer].custom=0;}
      r.truth=Array.isArray(D.truth)?D.truth.slice():D.truth; r.hint=D.hint;
      const top=Array.isArray(D.truth)?D.truth[0]:D.truth;
      r.shown=D.hint==='true'?top:D.hint==='lie'?D.lie:null; g.phase='guess';}); top0(); break;
    case 'guess': D.guess=v; render(); break;
    case 'bet': D.bet=v; render(); break;
    case 'submitGuess': act(g=>{g.r.guess=Array.isArray(D.guess)?D.guess.slice():D.guess;g.r.bet=D.bet;g.phase='challenge';}); top0(); break;
    case 'challenge': act(g=>{g.r.challenged=true;g.phase='respond';}); break;
    case 'noChallenge': act(g=>{g.r.challenged=false;resolve(g);}); top0(); break;
    case 'accept': act(g=>{g.r.accepted=true;resolve(g);}); top0(); break;
    case 'retreat': act(g=>{g.r.accepted=false;resolve(g);}); top0(); break;
    case 'pick': D.pick=v; render(); break;
    case 'wbet': D.wbet=v; render(); break;
    case 'submitWho': submitSim('who',v,{pick:D.pick,bet:D.wbet}); top0(); break;
    case 'potc': D.pot=t.dataset.k; render(); break;
    case 'submitPot': submitSim('pot',v,D.pot); top0(); break;
    case 'next': if(G.round!==v||G.phase!==t.dataset.k) return; act(g=>nextRound(g)); top0(); break;
    case 'rematch': {
      const g=newGame(G.players.map(p=>p.name),G.total,G.cats||cfg.cats,G.prize,(G.starter+1)%2);
      if(MODE==='online'){g.code=G.code;g.createdAt=Date.now();} localSeen=''; commit(g); top0(); break; }
  }
});
document.addEventListener('change',e=>{
  if(e.target.name==='hint'){ D.hint=e.target.value; const q=qOf(G.r); if(D.hint==='lie') D.lie=(q.t==='n'&&!D.custom)?D.truth:null; render(); }
});

/* ================= pick a transport ================= */
render();
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('db').then(x=>{ if(x){db=x;ONLINE='db';} else ONLINE=false; if(VIEW==='home') render(); }).catch(()=>{ONLINE=false;render();});
} else { ONLINE=typeof Peer!=='undefined'?'peer':false; if(VIEW==='home') render(); }
})();
</script>

</body>
</html>
